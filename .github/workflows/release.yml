name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.check.cjs
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Run offline Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: node node_modules/@tauri-apps/cli/tauri.js
          args: --bundles nsis,msi --ci -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: AreTwo - R2 Explorer ${{ github.ref_name }}
          releaseBody: |
            Windows x64 installers (NSIS and MSI) and standalone executable.
            These builds are unsigned and require WebView2.

            File icons by [Material Icon Theme](https://github.com/material-extensions/vscode-material-icon-theme), MIT license.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadPlainBinary: true
